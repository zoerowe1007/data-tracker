name: daily run

on:
  schedule:
    # Twice a day: if GitHub skips or delays one run, the next one makes the day up.
    # A second run on the same UTC day replaces that day's data, so each day still counts once.
    - cron: "11 8 * * *"     # 08:11 UTC
    - cron: "41 20 * * *"    # 20:41 UTC
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write             # commit the raw, history and status files
  issues: write               # the daily Issue
  pages: write                # ask Pages to rebuild after the commit

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the pipeline (sources, history, status, Issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tracker.run
      - name: Commit the raw files, history, status and run log
        if: always()
        run: |
          git config user.name "data-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/run_log.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
      - name: Ask GitHub Pages to rebuild
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
