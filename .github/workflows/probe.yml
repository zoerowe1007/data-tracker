name: probe stocks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_stocks.py
      - name: Commit the answers
        if: always()
        run: |
          git config user.name "data-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe_stocks.json
          git diff --cached --quiet || git commit -m "Probe stock endpoints"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
